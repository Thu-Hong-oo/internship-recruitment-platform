version: '3.8'

services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: libretranslate
    restart: unless-stopped
    environment:
      # Only load required languages to reduce boot time & memory usage
      - LT_LOAD_ONLY=vi,en
      # Raise request size limit so long descriptions work
      - LT_CHAR_LIMIT=7000
    ports:
      - '${LIBRETRANSLATE_PORT:-5000}:5000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5000/languages']
      interval: 30s
      timeout: 5s
      retries: 5











