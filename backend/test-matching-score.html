<!DOCTYPE html>
<html>
<head>
    <title>Test Matching Score API</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #result { margin-top: 20px; white-space: pre-wrap; background: #f5f5f5; padding: 15px; border-radius: 5px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Test Matching Score API (Port 3000)</h1>
    <button onclick="testAPI()">Test Matching Score</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = '⏳ Calculating matching score...';
            
            try {
                const response = await fetch('http://localhost:3000/api/nlp/matching-score', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        candidateId: '68da2e6362b86d4ab4daff7b',
                        jobId: '693053ccefb9cf755b1a1f16',
                        forceRecalculate: true
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'success';
                    resultDiv.textContent = '✅ SUCCESS!\n\n' + JSON.stringify(data, null, 2);
                } else {
                    resultDiv.className = 'error';
                    resultDiv.textContent = '❌ ERROR!\n\n' + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.textContent = '❌ NETWORK ERROR!\n\n' + error.message;
            }
        }
    </script>
</body>
</html>
